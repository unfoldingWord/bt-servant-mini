<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BT Servant Mini</title>
<style>
  :root { --bg: #f6f5f2; --fg: #1d1d1b; --muted: #6b6a66; --me: #2f5d50; --me-fg: #fff; --bot: #fff; --line: #e2e0da; --accent: #2f5d50; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161615; --fg: #ecebe7; --muted: #9a9892; --me: #3f7a69; --me-fg: #fff; --bot: #222220; --line: #33322f; --accent: #6fb39d; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 16px/1.45 system-ui, -apple-system, "Noto Sans", "Noto Sans Devanagari", sans-serif; }
  body { display: flex; flex-direction: column; }
  header { padding: 12px 16px 8px; border-bottom: 1px solid var(--line); display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  header h1 { font-size: 18px; margin: 0; letter-spacing: .2px; }
  #status { font-size: 13px; color: var(--muted); }
  #status[data-ok="true"] { color: var(--accent); }
  #packs { font-size: 12px; color: var(--muted); margin-left: auto; }
  #log { flex: 1; overflow-y: auto; padding: 12px 16px 4px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 92%; padding: 10px 12px; border-radius: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .me { align-self: flex-end; background: var(--me); color: var(--me-fg); border-bottom-right-radius: 4px; }
  .bot { align-self: flex-start; background: var(--bot); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
  .pending { color: var(--muted); font-style: italic; }
  details { margin-top: 8px; font-size: 12px; color: var(--muted); white-space: normal; }
  details pre { white-space: pre-wrap; font-size: 11px; max-height: 240px; overflow: auto; }
  .examples { display: flex; flex-wrap: wrap; gap: 6px; }
  .examples button { border: 1px solid var(--line); background: transparent; color: var(--fg); border-radius: 999px; padding: 6px 10px; font: inherit; font-size: 14px; text-align: left; }
  form { display: flex; gap: 8px; padding: 8px 12px calc(10px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); background: var(--bg); }
  textarea { flex: 1; resize: none; min-height: 44px; max-height: 120px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--bot); color: var(--fg); font: inherit; }
  textarea::placeholder { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #send { min-width: 72px; border: 0; border-radius: 12px; background: var(--accent); color: #fff; font: inherit; font-weight: 600; }
  #send:disabled { opacity: .45; }
</style>
</head>
<body>
<header><h1>BT Servant Mini</h1><span id="status"></span><span id="packs"></span></header>
<main id="log" aria-live="polite"></main>
<form id="ask"><textarea id="q" rows="1" enterkeyhint="send"></textarea><button id="send" type="submit" disabled>Send</button></form>
<script type="module" src="./main.js"></script>
</body>
</html>
