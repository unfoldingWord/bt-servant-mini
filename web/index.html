<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BT Servant Mini</title>
<style>
  /* The look of the BT Servant web client: cream page, beige bubbles for the person, the answer as plain serif text, terracotta accent. */
  :root {
    --bg: #f5f5f0; --fg: #1a1a18; --muted: #6b6a68; --faint: #9a9893; --me: #ddd9ce; --card: #ffffff; --line: #00000015;
    --accent: #ae5630; --accent-hover: #c4633a; --accent-soft: #ae563018; --ok: #3d7a4f;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #262624; --fg: #eeeeee; --muted: #b8b5a9; --faint: #8a8985; --me: #393937; --card: #30302e; --line: #6c6a6040;
      --accent: #c4633a; --accent-hover: #d67447; --accent-soft: #c4633a26; --ok: #7fbf8f; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); }
  body { display: flex; flex-direction: column; font: 16px/1.5 system-ui, -apple-system, "Noto Sans", "Noto Sans Devanagari", sans-serif; }
  header { display: flex; align-items: center; gap: 10px; padding: 10px 14px; position: relative; }
  #menu { border: 0; background: transparent; color: var(--muted); padding: 6px; border-radius: 8px; display: grid; place-items: center; }
  #menu:active { background: var(--line); }
  .brand { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .brand svg { width: 20px; height: 23px; flex: none; }
  .brand h1 { font: 600 18px/1 Georgia, "Noto Serif", serif; margin: 0; letter-spacing: .1px; white-space: nowrap; }
  .badge { font: 600 10.5px/1 system-ui, sans-serif; letter-spacing: .6px; text-transform: uppercase; color: var(--accent);
    background: var(--accent-soft); border-radius: 999px; padding: 4px 7px 3px; }
  /* the bar shows only a dot (tap: About); what needs attention goes in #notice under the bar, where it can wrap */
  #status { margin-inline-start: auto; flex: none; border: 0; background: transparent; padding: 10px; border-radius: 50%; cursor: pointer; display: grid; place-items: center; }
  #status::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--faint); }
  #status[data-ok="true"]::before { background: var(--ok); }
  #status[data-state="downloading"]::before, #status[data-state="copying"]::before, #status[data-state="importing"]::before, #status[data-state="starting"]::before { background: var(--accent); animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
  #notice { display: block; width: calc(100% - 28px); margin: 0 14px 6px; text-align: start; font: 13px/1.4 system-ui, sans-serif; color: var(--muted);
    background: var(--accent-soft); border: 0; border-radius: 10px; padding: 8px 12px; cursor: pointer; }
  #notice[hidden] { display: none; }
  #netnote { display: flex; gap: 8px; align-items: flex-start; margin: 0 14px 8px; padding: 10px 12px; border-radius: 12px; background: var(--card); border-inline-start: 3px solid var(--accent); font: 13.5px/1.45 system-ui, sans-serif; color: var(--fg); }
  #netnote.back { border-inline-start-color: #3a9d5d; }
  #netnote span { flex: 1; }
  #netnote .x { border: 0; background: transparent; color: var(--muted); font-size: 18px; line-height: 1; padding: 0 2px; cursor: pointer; }
  #pwahint { display: flex; gap: 8px; align-items: center; margin: 0 14px 8px; padding: 10px 12px; border-radius: 12px; background: var(--card); border-inline-start: 3px solid var(--accent); font: 13.5px/1.45 system-ui, sans-serif; color: var(--fg); }
  #pwahint span { flex: 1; }
  #pwahint .go { border: 0; border-radius: 999px; background: var(--accent); color: #fff; padding: 6px 12px; font: inherit; font-weight: 600; cursor: pointer; }
  #pwahint .x { border: 0; background: transparent; color: var(--muted); font-size: 18px; line-height: 1; padding: 0 2px; cursor: pointer; }
  .brand { flex: 0 1 auto; }
  #log { flex: 1; overflow-y: auto; padding: 8px 16px 12px; display: flex; flex-direction: column; gap: 18px; }
  .msg { overflow-wrap: anywhere; }
  .me { align-self: flex-end; max-width: 85%; background: var(--me); border-radius: 14px; padding: 9px 14px; white-space: pre-wrap; }
  .bot { align-self: stretch; font-family: Georgia, "Noto Serif", "Noto Serif Devanagari", serif; font-size: 16.5px; line-height: 1.6; }
  .pending { color: var(--faint); font-style: italic; }
  /* the waiting line: a small orb that breathes and a text that shimmers, never fully opaque, and legible at its dimmest (waiting.ts) */
  .wait { display: flex; align-items: center; font: 14px/1.4 system-ui, "Noto Sans", "Noto Sans Devanagari", sans-serif; font-style: normal; color: var(--muted); }
  .wait .orb { flex: none; width: 12px; height: 12px; border-radius: 50%; margin-inline-end: 8px; background: var(--accent); background: radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--accent) 55%, #fff), var(--accent) 70%);
    animation: orb-breathe 2.4s ease-in-out infinite; }
  .wait .wt { animation: wait-shimmer 2s ease-in-out infinite; }
  @keyframes orb-breathe { 0%, 100% { transform: scale(.72); opacity: .6; } 50% { transform: scale(1); opacity: 1; } }
  @keyframes wait-shimmer { 0%, 100% { opacity: .6; } 50% { opacity: .9; } }
  @media (prefers-reduced-motion: reduce) { .wait .orb { animation: none; transform: none; opacity: .85; } .wait .wt { animation: none; opacity: .8; } }
  .intro { margin: 0 0 10px; }
  .info { font: 14.5px/1.55 system-ui, "Noto Sans", "Noto Sans Devanagari", sans-serif; background: var(--card);
    border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .plain { white-space: pre-wrap; }
  .plain.md { white-space: normal; }
  .info h3, .md h3 { font: 600 17px/1.3 Georgia, "Noto Serif", "Noto Serif Devanagari", serif; margin: 2px 0 10px; }
  .info h4, .md h4 { font: 600 12px/1.3 system-ui, sans-serif; text-transform: uppercase; letter-spacing: .5px; color: var(--accent); margin: 16px 0 6px; }
  .info h5, .md h5 { font: 600 14px/1.3 system-ui, sans-serif; margin: 12px 0 4px; }
  .info p { margin: 0 0 10px; }
  .info ul, .info ol { margin: 0 0 10px; padding-inline-start: 22px; }
  .info li { margin: 0 0 8px; }
  /* an English item in an Arabic list (or the other way round, md.ts): its bullet would sit on the bubble's edge, where the list has no padding.
     By the resolved direction, so a nested list without its own dir and a dir="auto" item count too; by the attributes where :dir() is missing */
  :is(ul, ol):dir(rtl) > li:dir(ltr), :is(ul, ol):dir(ltr) > li:dir(rtl) { list-style-position: inside; }
  @supports not selector(:dir(rtl)) {
    :is(ul, ol)[dir="rtl"] > li[dir="ltr"], :is(ul, ol)[dir="ltr"] > li[dir="rtl"] { list-style-position: inside; }
  }
  .info li::marker { color: var(--faint); }
  .info strong { font-weight: 650; }
  .info em { color: var(--muted); }
  .info > :last-child { margin-bottom: 0; }
  .follow { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .follow button { font: 14px/1.3 system-ui, sans-serif; color: var(--fg); background: transparent; border: 1px solid var(--line);
    border-radius: 10px; padding: 7px 11px; text-align: start; }
  .follow button:active { background: var(--line); }
  details { margin-top: 8px; font: 12px system-ui, sans-serif; color: var(--faint); }
  details pre { white-space: pre-wrap; font-size: 11px; max-height: 240px; overflow: auto; }
  details > p.src-line { font: 12px/1.4 system-ui, sans-serif; color: var(--muted); margin: 6px 0; overflow-wrap: anywhere; } /* the answer's source, from under the answer (main.ts) */
  .welcome { margin: auto 0; text-align: center; padding: 24px 6px 8px; }
  .welcome svg { width: 34px; height: 39px; }
  .welcome h2 { font: 400 26px/1.25 Georgia, "Noto Serif", "Noto Serif Devanagari", serif; margin: 14px 0 8px; }
  .welcome p { color: var(--muted); margin: 0 auto 18px; max-width: 34ch; font-size: 15px; }
  /* first use: the language picker (firstuse.ts), in the welcome or under a question that waits for a language */
  .fu { text-align: start; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin: 4px 0 8px;
    font: 15px/1.4 system-ui, "Noto Sans", "Noto Sans Devanagari", sans-serif; }
  .fu h3 { font: 600 16px/1.3 system-ui, sans-serif; margin: 0 0 4px; }
  .welcome .fu p, .fu p { color: var(--muted); margin: 0 0 10px; font-size: 14px; max-width: none; }
  .fu-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; max-height: 46vh; overflow: auto; }
  .fu-list button { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; text-align: start; font: inherit; color: var(--fg);
    background: transparent; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-height: 44px; }
  .fu-list button.on { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); }
  .fu-s { color: var(--muted); font-size: 13px; white-space: nowrap; }
  .fu-go { width: 100%; border: 0; border-radius: 12px; background: var(--accent); color: #fff; padding: 12px; font: inherit; font-weight: 600; min-height: 44px; }
  .fu-alt, .fu-file { width: 100%; border: 1px solid var(--line); border-radius: 12px; background: transparent; color: var(--fg); padding: 10px; font: inherit; margin-top: 8px; }
  .fu-file { border: 0; color: var(--muted); font-size: 14px; padding: 8px; }
  .fu-model { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 6px 0 4px; color: var(--muted);
    font: 13.5px/1.4 system-ui, "Noto Sans", "Noto Sans Devanagari", sans-serif; }
  .fu-model span { flex: 1 1 220px; }
  .fu-model button { font: inherit; color: var(--fg); background: transparent; border: 1px solid var(--line); border-radius: 10px; padding: 7px 11px; min-height: 40px; }
  .fu-bar { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; margin: 4px 0 6px; }
  .fu-bar > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }
  .welcome .fu .fu-name, .fu .fu-name { color: var(--fg); font-weight: 600; margin: 6px 0 4px; }
  .welcome .fu .fu-err, .fu .fu-err { color: var(--accent); }
  form { display: flex; align-items: flex-end; gap: 8px; margin: 0 12px calc(12px + env(safe-area-inset-bottom)); padding: 6px 6px 6px 14px;
    background: var(--card); border-radius: 18px; box-shadow: 0 4px 20px rgba(0,0,0,.035), 0 0 0 .5px rgba(0,0,0,.08); }
  textarea { flex: 1; resize: none; min-height: 40px; max-height: 120px; padding: 9px 0; border: 0; outline: none; background: transparent; color: var(--fg);
    font: 16.5px/1.4 system-ui, "Noto Sans", "Noto Sans Devanagari", sans-serif; }
  textarea::placeholder { color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #send { width: 38px; height: 38px; border: 0; border-radius: 10px; background: var(--accent); color: #fff; display: grid; place-items: center; flex: none; }
  #send:active { background: var(--accent-hover); }
  #send:disabled { opacity: .45; }
  /* the arrow back to the latest message (tobottom.ts): 32 px round, slightly translucent (white on the accent stays above 3:1), centred just above the card (so above the suggestion row, which is inside it) */
  #tobottom { position: fixed; z-index: 4; left: 50%; bottom: var(--tb-bottom, 90px); transform: translateX(-50%); width: 32px; height: 32px; padding: 0; border: 0; border-radius: 50%;
    background: var(--accent); color: #fff; display: grid; place-items: center; cursor: pointer; opacity: .75; transition: opacity .2s; box-shadow: 0 2px 8px rgba(0,0,0,.18); }
  #tobottom::after { content: ""; position: absolute; inset: -6px; border-radius: 50%; } /* a 44 px target */
  #tobottom:hover, #tobottom:focus-visible, #tobottom:active { opacity: 1; }
  #tobottom:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #tobottom[hidden] { display: none; }
  #tobottom .tb-dot { position: absolute; top: -2px; inset-inline-end: -2px; width: 10px; height: 10px; border-radius: 50%; background: var(--fg); box-shadow: 0 0 0 2px var(--bg); }
  #tobottom .tb-dot[hidden] { display: none; }
  /* not over the full-screen cards (the translucent ones let it show through) nor the PIN lock */
  body[data-tb-off] #tobottom { display: none; } /* (tobottom.ts sets it while one is open) */
  @media (prefers-reduced-motion: reduce) { #tobottom { transition: none; } }
  /* typing suggestions (composer.ts): one row above the box, inside the card; it scrolls sideways, never wraps to a second row */
  #ask { flex-wrap: wrap; }
  .cmp { flex: 0 0 100%; min-width: 0; display: flex; align-items: center; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 2px 0 4px;
    -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 28px), transparent); mask-image: linear-gradient(to right, #000 calc(100% - 28px), transparent); }
  [dir="rtl"] .cmp { -webkit-mask-image: linear-gradient(to left, #000 calc(100% - 28px), transparent); mask-image: linear-gradient(to left, #000 calc(100% - 28px), transparent); }
  .cmp[hidden] { display: none; }
  .cmp::-webkit-scrollbar { display: none; }
  .cmp-chip { flex: none; min-height: 44px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--fg);
    font: 14.5px/1.5 system-ui, "Noto Sans", "Noto Sans Devanagari", sans-serif; white-space: nowrap; }
  .cmp-ok { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .cmp-missing { color: var(--muted); border-style: dashed; }
  .cmp-nums { display: flex; gap: 4px; flex: none; }
  .cmp-pick { display: flex; gap: 8px; flex: none; }
  .cmp-next { border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .cmp-story { border-color: var(--accent); }
  .cmp-stories { color: var(--accent); }
  .cmp-n { flex: none; width: 44px; height: 44px; border-radius: 10px; border: 1px solid var(--line); background: transparent; color: var(--fg); font: 15px/1 system-ui, sans-serif; }
  .cmp-note { flex: none; color: var(--muted); font: 13.5px/1.5 system-ui, sans-serif; white-space: nowrap; }
  .cmp button:active { background: var(--line); }
  .cmp .cmp-ok:active { background: var(--accent-hover); }
  .cmp-free { flex: 1 1 auto; min-width: 0; white-space: normal; padding: 4px 2px; }
  .cmp-said { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  #panel { display: none; position: absolute; z-index: 5; left: 8px; right: 8px; top: 56px; background: var(--card); border-radius: 14px;
    padding: 10px 14px 14px; box-shadow: 0 12px 32px rgba(0,0,0,.18), 0 0 0 .5px rgba(0,0,0,.08); max-height: 75vh; overflow-y: auto; }
  #panel.show { display: block; }
  #panel h2 { font: 600 12px/1 system-ui, sans-serif; text-transform: uppercase; letter-spacing: .6px; color: var(--faint); margin: 10px 0 8px; }
  #panel .row { display: flex; gap: 8px; align-items: center; padding: 3px 0; }
  #panel .open { flex: 1; text-align: start; border: 1px solid var(--line); background: transparent; color: var(--fg); border-radius: 10px; padding: 10px;
    font: inherit; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #panel .row.on .open { background: var(--me); border-color: transparent; }
  #panel .del { border: 0; color: #b4432f; background: transparent; padding: 9px 6px; font: inherit; font-size: 14px; }
  #panel .del.armed { background: #b4432f; color: #fff; border-radius: 10px; padding: 9px 10px; white-space: nowrap; }
  #panel .add { margin-top: 8px; width: 100%; border: 0; border-radius: 10px; background: var(--accent); color: #fff; padding: 10px; font: inherit; font-weight: 600; }
  #panel .add:disabled { opacity: .4; }
  #panel .note { font-size: 13px; color: var(--muted); margin: 8px 0 0; }
  #panel .langs { display: flex; flex-wrap: wrap; gap: 6px; }
  #panel .langs button { border: 1px solid var(--line); background: transparent; color: var(--fg); border-radius: 999px; padding: 6px 12px; font: inherit; font-size: 14px; }
  #panel .langs button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  #panel .packs { font-size: 13px; color: var(--muted); }
  /* Resources and server screens (resources.ts): a card per language, parts one under another; logical sides, so Arabic flips alone */
  #panel .res-card { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin: 0 0 10px; }
  #panel .res-name { font-weight: 600; font-size: 14.5px; margin-bottom: 4px; }
  #panel .res-line { font-size: 14px; padding: 2px 0; padding-inline-start: 2px; }
  #panel .res-line.note { font-size: 13px; margin: 2px 0; }
  #panel .res-h { margin-top: 16px; }
  #panel .res-btns { flex-wrap: wrap; justify-content: flex-start; margin-top: 4px; }
  #panel .res-dl { flex-wrap: wrap; }
  #panel .res-none { margin: 10px 0 6px; }
  #panel .setup .row { display: flex; align-items: center; gap: 8px; padding: 4px 0; }
  #panel .grow { flex: 1; font-size: 14.5px; }
  #panel button.small { border: 1px solid var(--line); background: transparent; color: var(--fg); border-radius: 8px; padding: 6px 9px; font: inherit; font-size: 13px; }
  #panel button.small.del { color: #b4432f; }
  #panel .about-link { margin-top: 14px; width: 100%; border: 0; background: transparent; color: var(--accent); font: inherit; font-size: 14.5px; text-align: start; padding: 8px 0; }
  #panel .foot { display: flex; flex-wrap: wrap; gap: 0 18px; margin-top: 6px; }
  #panel .foot .about-link { width: auto; margin-top: 8px; }
  #about, #safety, #report { position: fixed; inset: 0; z-index: 10; background: var(--bg); background: color-mix(in srgb, var(--bg) 92%, transparent); display: flex; align-items: center; justify-content: center; padding: 16px; }
  #about .card, #safety .card, #report .card { background: var(--card); border-radius: 18px; padding: 22px 20px 18px; max-width: 520px; max-height: 92vh; overflow-y: auto; box-shadow: 0 12px 40px rgba(0,0,0,.18); }
  #about h2, #safety h2, #report h2 { font: 600 22px/1.25 Georgia, "Noto Serif", serif; margin: 0 0 12px; }
  #about p, #safety p, #report p { margin: 0 0 12px; line-height: 1.55; font-size: 15.5px; }
  #about .meta, #safety .meta, #report .meta { color: var(--muted); font-size: 13.5px; }
  #about .setup h2, #safety .setup h2, #report .setup h2 { font: 600 12px/1 system-ui, sans-serif; text-transform: uppercase; letter-spacing: .6px; color: var(--faint); margin: 8px 0; }
  #about .langs, #safety .langs, #report .langs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  #about .langs button, #safety .langs button, #report .langs button { border: 1px solid var(--line); background: transparent; color: var(--fg); border-radius: 10px; padding: 8px 12px; font: inherit; font-size: 14px; }
  #about .langs button.on, #safety .langs button.on, #report .langs button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  #about button.primary, #safety button.primary, #report button.primary { width: 100%; border: 0; border-radius: 12px; background: var(--accent); color: #fff; padding: 12px; font: inherit; font-weight: 600; margin-top: 4px; }
  #safety { z-index: 11; }
  #report { z-index: 12; }
  /* How to ask (howto.ts): one card at a time over the chat, like About; under the PIN lock (20) */
  #howto { position: fixed; inset: 0; z-index: 10; background: var(--bg); background: color-mix(in srgb, var(--bg) 92%, transparent); display: flex; align-items: center; justify-content: center; padding: 16px; }
  #howto .card { background: var(--card); border-radius: 18px; padding: 16px 20px 18px; width: 100%; max-width: 520px; max-height: 92vh; overflow-y: auto; box-sizing: border-box; box-shadow: 0 12px 40px rgba(0,0,0,.18); outline: none; }
  .howto-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
  .howto-step { font: 600 12px/1 system-ui, sans-serif; letter-spacing: .5px; color: var(--faint); }
  #howto h2 { font: 600 22px/1.25 Georgia, "Noto Serif", "Noto Serif Devanagari", serif; margin: 0 0 10px; }
  #howto p { margin: 0 0 12px; line-height: 1.55; font-size: 15.5px; }
  .howto-ex { list-style: none; margin: 0 0 12px; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .howto-ex li { font: 15px/1.35 system-ui, "Noto Sans", "Noto Sans Devanagari", sans-serif; background: var(--bg); border-radius: 10px; padding: 8px 12px; }
  .howto-try { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 12px; }
  .howto-try button, .howto-nav button { flex: 1 1 0; min-height: 44px; border-radius: 12px; font: inherit; font-weight: 600; padding: 10px 12px; cursor: pointer; }
  #howto button.primary { border: 0; background: var(--accent); color: #fff; }
  #howto button.secondary { border: 1px solid var(--line); background: transparent; color: var(--fg); }
  #howto button:disabled { opacity: .4; cursor: default; }
  #howto .howto-free { color: var(--muted); font-size: 14px; border-top: 1px solid var(--line); padding-top: 10px; }
  .howto-nav { display: flex; gap: 8px; }
  .howto-x { border: 0; background: transparent; color: var(--muted); font-size: 22px; line-height: 1; min-width: 44px; min-height: 44px; cursor: pointer; }
  /* The welcome (welcome.ts): one screen over the chat, like How to ask; under the PIN lock (20) */
  #welcome { position: fixed; inset: 0; z-index: 10; background: var(--bg); background: color-mix(in srgb, var(--bg) 92%, transparent); display: flex; align-items: center; justify-content: center; padding: 16px; }
  #welcome .card { background: var(--card); border-radius: 18px; padding: 12px 18px 16px; width: 100%; max-width: 520px; max-height: 92vh; overflow-y: auto; box-sizing: border-box; box-shadow: 0 12px 40px rgba(0,0,0,.18); outline: none; }
