# BT Servant Mini for iOS, built on a Mac in the cloud (nobody on the project has one).
# 1. llama.cpp for iPhone and the simulator (cached: it only changes with LLAMA_TAG).
# 2. The Xcode project from ios/project.yml (XcodeGen).
# 3. The app in the simulator with --selftest: download the model, add English, ask; the steps and screenshots are artifacts.
# 4. An unsigned .ipa for the device (sideloading for testing). Signing and TestFlight come when unfoldingWord's Apple
#    Developer account is connected (repository secrets).
name: iOS

on:
  workflow_dispatch:
  push:
    branches: [master, ios-native]
    paths: ['ios/**', '.github/workflows/ios.yml']

env:
  LLAMA_TAG: b12361

defaults:
  run:
    shell: bash # -eo pipefail: a failing xcodebuild is not hidden by | tail

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: llama.cpp (cache)
        id: llama
        uses: actions/cache@v4
        with:
          path: ios/vendor/llama.xcframework
          key: llama-xcframework-${{ env.LLAMA_TAG }}-ios-v1

      - name: llama.cpp (build for iPhone and the simulator)
        if: steps.llama.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$LLAMA_TAG" https://github.com/ggml-org/llama.cpp.git "$RUNNER_TEMP/llama.cpp"
          cd "$RUNNER_TEMP/llama.cpp"
          ./build-xcframework.sh ios-sim ios-device
          mkdir -p "$GITHUB_WORKSPACE/ios/vendor"
          cp -R build-apple/llama.xcframework "$GITHUB_WORKSPACE/ios/vendor/"

      - name: Xcode project
        working-directory: ios
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build for the simulator
        working-directory: ios
        run: |
          xcodebuild -project BTServantMini.xcodeproj -scheme BTServantMini -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build | tail -40
          test -d build/Build/Products/Debug-iphonesimulator/BTServantMini.app

      - name: Self-test in the simulator
        working-directory: ios
        run: |
          set -x
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          d = json.load(sys.stdin)["devices"]
          ios = sorted((k for k in d if "iOS" in k), key=lambda k: [int(x) for x in k.split("iOS-")[1].split("-")])
          for rt in reversed(ios):
              for dev in d[rt]:
                  if dev["name"].startswith("iPhone"):
                      print(dev["udid"]); sys.exit()
          ')
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" build/Build/Products/Debug-iphonesimulator/BTServantMini.app
          mkdir -p out
          xcrun simctl launch "$UDID" org.unfoldingword.btservantmini --selftest
          sleep 20
          xcrun simctl io "$UDID" screenshot out/1-launch.png
          DATA=$(xcrun simctl get_app_container "$UDID" org.unfoldingword.btservantmini data)
          for i in $(seq 1 180); do
            if [ -f "$DATA/Documents/selftest.json" ] && grep -qE '"step" : "(done|error)"' "$DATA/Documents/selftest.json"; then break; fi
            sleep 10
          done
          xcrun simctl io "$UDID" screenshot out/2-end.png
          cp "$DATA/Documents/selftest.json" out/ || echo "no selftest.json" > out/selftest-missing.txt
          xcrun simctl spawn "$UDID" log show --last 30m --predicate 'process == "BTServantMini"' --style compact > out/app.log 2>&1 || true
          cat out/selftest.json || true
          grep -q '"step" : "done"' out/selftest.json

      - name: Unsigned .ipa for iPhone
        if: always()
        working-directory: ios
        run: |
          mkdir -p out
          xcodebuild -project BTServantMini.xcodeproj -scheme BTServantMini -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build | tail -20
          mkdir -p ipa/Payload
          cp -R build/Build/Products/Release-iphoneos/BTServantMini.app ipa/Payload/
          (cd ipa && zip -qry ../out/BTServantMini-unsigned.ipa Payload)
          ls -la out

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-${{ github.run_number }}
          path: ios/out
